id: "153"
type: number
display: "153"
mappings:
  - system: cultural
    to: "Miraculous catch of 153 fish"
    note: "John 21:11 — after the Resurrection, the disciples haul in a net of exactly 153 fish. The specificity of the count has generated speculation for two millennia."
  - system: math
    to: "Narcissistic number"
    note: "1³ + 5³ + 3³ = 1 + 125 + 27 = 153. The smallest non-trivial Armstrong number."
  - system: math
    to: "Triangular number"
    note: "T₁₇ = 1+2+…+17 = 153."
